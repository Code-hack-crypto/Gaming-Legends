<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090910">
    <title>Logo Options — NEON//RONIN</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-ronin-mask.svg">
    <link rel="apple-touch-icon" href="assets/logo-ronin-mask.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="section-wrap">
      <div class="section-heading">
        <div>
          <p class="eyebrow section-eyebrow"><span class="section-number">LOGO</span> THREE ORIGINAL DIRECTIONS</p>
          <h1 class="worlds-title">Choose your <span>mark.</span></h1>
        </div>
      </div>
      <div class="world-grid logo-options">
        <article class="game-card">
          <div class="game-art logo-option"><img class="game-image" src="assets/logo-neon-monogram.svg" alt="Neon Ronin NR monogram logo option"></div>
          <div class="game-details"><div><h3>Option 1 — Neon Monogram</h3><p>Clean, sharp, and ideal for avatars or favicons.</p></div></div>
        </article>
        <article class="game-card">
          <div class="game-art logo-option"><img class="game-image" src="assets/logo-katana-mark.svg" alt="Neon Ronin katana logo option"></div>
          <div class="game-details"><div><h3>Option 2 — Katana</h3><p>More energetic, with a clear gaming identity.</p></div></div>
        </article>
        <article class="game-card">
          <div class="game-art logo-option"><img class="game-image" src="assets/logo-ronin-mask.svg" alt="Neon Ronin mask logo option"></div>
          <div class="game-details"><div><h3>Option 3 — Ronin Mask</h3><p>The boldest choice, with a strong arcade character.</p></div></div>
        </article>
      </div>
    </main>
  </body>
</html>
